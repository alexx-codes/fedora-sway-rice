# kitty terminal — fedora-sway-rice
#
# Colors are NOT set here. theme/colors.env -> scripts/theme-gen.py generates
# theme/kitty.conf, and the include at the BOTTOM of this file pulls it in.
# kitty is last-wins on duplicate keys, so that include must stay last or the
# generated palette loses to anything above it. Edit theme/colors.env and run
# scripts/theme-gen.py; never edit the generated file.

font_family      Liga Comic Mono Bold
bold_font        Liga Comic Mono Bold
italic_font      auto
bold_italic_font auto
font_size        13.0

cursor_shape     block
cursor_trail     10
mouse_hide_wait  2.0

scrollback_lines 10000

background_opacity      0.96
hide_window_decorations yes
confirm_os_window_close 0

remember_window_size  no
initial_window_width  120c
initial_window_height 35c

# Wayland session; remote control is on for scripted window manipulation.
linux_display_server wayland
allow_remote_control yes

# Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select yes
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

# Mouse
mouse_map middle release ungrabbed paste_from_selection
mouse_map shift+middle release ungrabbed paste_from_primary

# Keyboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+c       copy_or_interrupt
map ctrl+v       paste_from_clipboard
map shift+insert paste_from_selection

# Generated palette — must remain the last line (kitty is last-wins).
include ~/.config/rice/theme/kitty.conf
