# Workspace numbers only. Apps are NOT pinned to a home workspace — a new
# window opens on whatever workspace is focused. Waybar renders the icons;
# names stay plain numbers so `swaymsg workspace number N` and the
# launch-or-focus script stay simple.

# The $mod+1..0 switch/move bindings live in keybinds.tsv (like every other
# binding) and are emitted into keybinds.conf — keybinds-gen.py fails the
# build if a bind directive appears in this file, so docs can't drift.
set $ws1 number 1
set $ws2 number 2
set $ws3 number 3
set $ws4 number 4
set $ws5 number 5
set $ws6 number 6
set $ws7 number 7
set $ws8 number 8
set $ws9 number 9
set $ws10 number 10
