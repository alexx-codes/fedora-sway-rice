# Workspace layout (confirmed):
#   1 terminal · 2 code · 3 web · 4 VMs · 5-9 free · 10 misc/chat
# Waybar renders the icons; workspace names stay plain numbers so
# `swaymsg workspace number N` and the launch-or-focus script stay simple.

# The $mod+1..0 switch/move bindings live in keybinds.tsv (like every other
# binding) and are emitted into keybinds.conf — keybinds-gen.py fails the
# build if a bind directive appears in this file, so docs can't drift.
set $ws1 number 1
set $ws2 number 2
set $ws3 number 3
set $ws4 number 4
set $ws5 number 5
set $ws6 number 6
set $ws7 number 7
set $ws8 number 8
set $ws9 number 9
set $ws10 number 10

# App home workspaces. VS Code sometimes reports app_id "Code" or
# "code-url-handler" depending on how it was launched, hence the patterns.
assign [app_id="^[Cc]ode(-url-handler)?$"] $ws2
assign [class="^[Cc]ode$"] $ws2
assign [app_id="^(firefox|org\.mozilla\.firefox)$"] $ws3
assign [app_id="^virt-manager$"] $ws4
