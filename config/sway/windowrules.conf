# Window rules — mostly taming virt-manager under a tiling WM.
#
# virt-manager behavior:
#  - The manager window and VM consoles tile normally on workspace 4
#    (assigned in workspaces.conf). Tiled consoles are the sane default:
#    they get the full tile and resize with the layout.
#  - Its many transient dialogs float, sized sensibly, instead of
#    grabbing half the screen as a tile.
for_window [app_id="^virt-manager$" title="^(New VM|Add New Virtual Hardware|Preferences|Connection Details|Choose Storage Volume|Change storage path|Clone Virtual Machine|Migrate the virtual machine|Delete|Are you sure.*|Warning|Error|Question|Input Error)"] floating enable
# Keep the machine awake while a VM console is visible — fullscreen OR
# windowed (guest installs are usually watched in a tiled console, and a
# 10-minute lock mid-install is worse than the tradeoff). The tradeoff is
# real: leaving a console visible and walking away means no autolock, so
# lock explicitly ($mod+Shift+x) when stepping away from VM work.
for_window [app_id="^virt-manager$" title=" on QEMU/KVM$"] inhibit_idle visible

# Small utility windows float
for_window [app_id="^(pavucontrol|org\.pulseaudio\.pavucontrol)$"] floating enable
for_window [app_id="^nm-connection-editor$"] floating enable
for_window [app_id="^(blueman-manager|\.blueman-manager-wrapped)$"] floating enable
for_window [app_id="^org\.gnome\.Calculator$"] floating enable
for_window [app_id="^swayimg$"] floating enable

# File pickers / portal dialogs
for_window [app_id="^xdg-desktop-portal-gtk$"] floating enable

# Firefox picture-in-picture: float, keep on all workspaces
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable

# Legacy X11 (XWayland) dialogs
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
