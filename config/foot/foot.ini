# Foot terminal — fedora-sway-rice
# Colors live in the active theme (dark/light) and are included at the
# bottom of this file. Open terminals are live-recolored by theme-toggle.sh
# via OSC sequences; the include makes every NEW terminal start in the
# right palette.

font=JetBrainsMono Nerd Font:size=11
pad=8x8

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[main]
include=~/.config/rice/active/foot.ini
