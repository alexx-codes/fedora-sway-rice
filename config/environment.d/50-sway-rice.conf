# Session environment for systemd user services (and, via sway-systemd's
# activation-environment import, for apps launched inside the session).
# ELECTRON_OZONE_PLATFORM_HINT makes Electron apps (VS Code) run native
# Wayland instead of XWayland — this is what fixes fractional-scaling blur
# and clipboard weirdness. The overridden code.desktop passes the flag
# explicitly too, so launcher starts are covered either way.
ELECTRON_OZONE_PLATFORM_HINT=auto
QT_QPA_PLATFORMTHEME=qt6ct
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
MOZ_ENABLE_WAYLAND=1
_JAVA_AWT_WM_NONREPARENTING=1
PATH=${HOME}/.cargo/bin:${HOME}/.local/bin:${PATH}
